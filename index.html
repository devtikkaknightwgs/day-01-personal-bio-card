<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="bio-card">
      <div class="bio-card__image">
        <img src="images/profile.jpg" alt="Profile Picture" />
      </div>
      <div class="bio-card__content">
        <h1 class="bio-card__name">John Doe</h1>
        <p class="bio-card__title">Full Stack Developer</p>
        <p class="bio-card__description">
          Passionate about building web applications and learning new
          technologies.
        </p>
        <ul class="bio-card__social-links">
          <li><a href="#">LinkedIn</a></li>
          <li><a href="#">GitHub</a></li>
          <li><a href="#">Twitter</a></li>
        </ul>
      </div>
    </div>
  </body>
</html>
